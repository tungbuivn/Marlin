; ===========================================================================
;  cydlcd -- firmware MAN HINH RIENG (MCU cua man hinh tu render)
;
;  Day KHONG phai env cua Marlin: la mot project PlatformIO RIENG, nen co build flag /
;  script / thu vien cua Marlin khong the lot vao (va nguoc lai).
;
;  Build / nap (chay tu thu muc goc repo):
;      pio run   -d cydlcd -e cydlcd_f411cc           ; STM32F411CCU6  256K/128K  (UI tu ve, G-code)
;      pio run   -d cydlcd -e cydlcd_f103c6           ; STM32F103C6T6   32K/ 10K  (UI tu ve, G-code)
;      pio run   -d cydlcd -e cydlcd_f407vgz_lvgl     ; STM32F407VGT6    1M/128K  (LVGL + PUSH)
;      pio run   -d cydlcd -e cydlcd_esp32        ; ESP32-2432S028R "CYD"      (LVGL + PUSH)
;      pio run   -d cydlcd -e cydlcd_f411cc_lvgl      ; STM32F411CCU6             (LVGL + PUSH)
;      pio run   -d cydlcd -e cydlcd_esp32 -t upload
;
;  HAI KIEU GIAO TIEP (chon bang env, khong phai sua code):
;    * "G-code"  (env *_f411cc / *_f103c6): man hinh CYD tu hoi Marlin bang M105/M114/M27.
;              Nhe, chay duoc tren F103C6 32K, nhung KHONG lay duoc du lieu nang
;              (danh sach file, bed mesh, PID/steps/mm, prompt...).
;    * "PUSH"    (env *_lvgl): Marlin chu dong day frame nhi phan xuong (ExtUI
;              "cydlcd_serial" trong Marlin, bat bang #define CYDLCD_SERIAL_UI) va man hinh CYD
;              ve bang LVGL. Day la kieu dung cho man hinh moi.
;
;  Khi build, moi env CHI lay dung cac file no can (build_src_filter):
;    - env G-code: loai <src/cydlcd_link.cpp>, <src/ui_lvgl.cpp>, <src/ui_port_*.cpp>
;    - env PUSH  : loai <src/marlin_link.cpp>, <src/ui.cpp> + file port cua board KIA (khong keo code khong dung)
;
;  !!! CAN MANG lan dau: env LVGL keo platform espressif32 (chi CYD) + thu vien lvgl
;      (va TFT_eSPI cho CYD). Env STM32 khong-LVGL build duoc offline.
; ===========================================================================

[platformio]
default_envs = cydlcd_f411cc

; ---------------------------------------------------------------------------
; Cau hinh chung cho cac board STM32 (framework Arduino cua ststm32)
; ---------------------------------------------------------------------------
[cydlcd_common]
platform         = ststm32
framework        = arduino
build_type       = release
; -Os + LTO: F103C6T6 chi co 32 KB flash, ma rieng `Serial` (HardwareSerial + Print)
; da an mot phan dang ke. LVGL thi can them cho chuong trinh + font.
build_flags      = -Os -flto -ffunction-sections -fdata-sections
                   -fno-exceptions
                   -Wall -Wno-unused-variable
; C++-only flags (-fno-rtti, -fno-threadsafe-statics) them o day de file .c cua core
; khong keu warning
extra_scripts    = post:tools/cxx_flags.py
lib_deps         =
upload_protocol  = stlink
debug_tool       = stlink
monitor_speed    = 115200

; ---------------------------------------------------------------------------
; STM32F411CCU6 ("Black Pill" style, 48-pin) -- UI tu ve, giao tiep G-code
; ---------------------------------------------------------------------------
[env:cydlcd_f411cc]
extends          = cydlcd_common
board            = genericSTM32F411CC
build_flags      = ${cydlcd_common.build_flags}
                   -DCYDLCD_BOARD_F411
                   -DCYDLCD_USE_LVGL=0
                   ; `Serial` = USART2 (PA2 TX / PA3 RX) -> di den Marlin
                   -DSERIAL_UART_INSTANCE=2 -DPIN_SERIAL_RX=PA3 -DPIN_SERIAL_TX=PA2
build_src_filter = +<*> -<cydlcd_link.cpp> -<ui_lvgl.cpp> -<ui_port_*.cpp>

; ---------------------------------------------------------------------------
; STM32F103C6T6 ("Blue Pill" 32K flash / 10K RAM) -- UI tu ve, giao tiep G-code
; (khong du cho LVGL: giu nguyen UI nhe)
; ---------------------------------------------------------------------------
[env:cydlcd_f103c6]
extends          = cydlcd_common
board            = genericSTM32F103C6
build_flags      = ${cydlcd_common.build_flags}
                   -DCYDLCD_BOARD_F103C6
                   -DCYDLCD_USE_LVGL=0
                   -DSERIAL_UART_INSTANCE=2 -DPIN_SERIAL_RX=PA3 -DPIN_SERIAL_TX=PA2
build_src_filter = +<*> -<cydlcd_link.cpp> -<ui_lvgl.cpp> -<ui_port_*.cpp>

; ---------------------------------------------------------------------------
; STM32F411CCU6 + LVGL (PUSH) -- du RAM/flash cho LVGL
;   lv_conf.h nam trong src/ -> -DLV_CONF_INCLUDE_SIMPLE de LVGL include duoc
; ---------------------------------------------------------------------------
[env:cydlcd_f411cc_lvgl]
extends          = cydlcd_common
board            = genericSTM32F411CC
build_flags      = ${cydlcd_common.build_flags}
                   -DCYDLCD_BOARD_F411
                   -DCYDLCD_USE_LVGL=1
                   -DTFT_ROTATION=1       ; man NGANG 320x240 (ui_lvgl)
                   -DLV_CONF_INCLUDE_SIMPLE
                   -Isrc
                   -DSERIAL_UART_INSTANCE=2 -DPIN_SERIAL_RX=PA3 -DPIN_SERIAL_TX=PA2
lib_deps         = lvgl/lvgl@^8.3.11
build_src_filter = +<*> -<marlin_link.cpp> -<ui.cpp> -<ui_port_cyd_st7789.cpp>

; ---------------------------------------------------------------------------
; STM32F407VGT6 (1 MB flash / 128 KB RAM) + LVGL (PUSH)
;   Board khac (vd F407ZGT6 144 chan): doi `board =` thanh black_f407zg /
;   vccgnd_f407zg_mini / genericSTM32F407IGT6 va giu nguyen phan con lai.
; ---------------------------------------------------------------------------
[env:cydlcd_f407vgz_lvgl]
extends          = cydlcd_common
board            = genericSTM32F407VGT6
build_flags      = ${cydlcd_common.build_flags}
                   -DCYDLCD_BOARD_F407
                   -DCYDLCD_USE_LVGL=1
                   -DTFT_ROTATION=1       ; man NGANG 320x240 (ui_lvgl)
                   -DLV_CONF_INCLUDE_SIMPLE
                   -Isrc
                   -DSERIAL_UART_INSTANCE=2 -DPIN_SERIAL_RX=PA3 -DPIN_SERIAL_TX=PA2
lib_deps         = lvgl/lvgl@^8.3.11
build_src_filter = +<*> -<marlin_link.cpp> -<ui.cpp> -<ui_port_cyd_st7789.cpp>

; ---------------------------------------------------------------------------
; ESP32-2432S028R ("CYD") 2.8" 240x320 ST7789 + XPT2046 -- LVGL (PUSH)
;
;   Man hinh: TFT_eSPI voi cau hinh rieng o tools/tft_setup_cyd/User_Setup.h
;   UART den Marlin: Serial2, GPIO22 (TX) / GPIO35 (RX) -- doi trong cydlcd_config.h
;                    (CYDLCD_UART_TX / CYDLCD_UART_RX). Nho noi CHEO TX<->RX + chung GND.
;   CAN MANG lan dau (platform espressif32 + lvgl + TFT_eSPI).
; ---------------------------------------------------------------------------
[env:cydlcd_esp32]
platform         = espressif32
board            = esp32dev
framework        = arduino
build_type       = release
; BANG PHAN VUNG: mac dinh cua board esp32dev (`default.csv`) chi cho app 1.25 MB, khong du cho
; LVGL + TFT_eSPI + WiFi + Bluetooth Classic (~1.77 MB, da build thu -> "program size ... greater
; than maximum allowed (1310720)"). `huge_app.csv` cho app 3 MB (con 1 MB SPiffs + 64 KB coredump).
; Phan vung `nvs` GIU NGUYEN offset/size (0x9000 / 0x5000) nhu default.csv nen ket qua hieu chuan
; cam ung da luu trong NVS KHONG bi mat khi nap lai. Panel khong dung SPIFFS/OTA -> doi vo hai.
board_build.partitions = huge_app.csv
build_flags      = -DCYDLCD_BOARD_CYD
                   -DCYDLCD_USE_LVGL=1
                   ; TAT DAO MAU cua panel. TFT_eSPI 2.5.43 gui `ST7789_INVON` VO DIEU KIEN
                   ; (TFT_Drivers/ST7789_Init.h:102) nen `TFT_INVERSION_ON` trong User_Setup.h
                   ; khong co tac dung. Co nay lam ui_port_cyd_st7789.cpp:429 goi
                   ; `invertDisplay(false)` sau init. Thieu no thi ca man hinh bi am ban
                   ; (nen sang, chu den) - do tren board that 2026-10-16.
                   -DCYDLCD_CYD_INVERT_OFF=1
                   ; Bat dong duoi khi can chan doan (in tien trinh ra Serial 115200:
                   ; reset reason, do chan den nen GPIO21/27, fillScreen do, heartbeat moi 1s)
                   ;-DCYDLCD_CYD_DEBUG=1
                   -DCYDLCD_CYD_DEBUG=1    ; TAM THOI: dang hieu chuan cam ung (in raw + px) -> bo sau
                   ; LVGL: env CYD dung `src/lv_conf_cydlcd.h` (include lv_conf.h roi ghi de
                   ; LV_MEM_SIZE 48 -> 24 KB). LY DO: DRAM cho bien tinh cua ESP32 (khong PSRAM)
                   ; chi 124.580 byte, WiFi + Bluetooth Classic can ~38 KB .bss -> khong du cho
                   ; pool 48 KB + buffer ve 25,6 KB. Xem dau file src/lv_conf_cydlcd.h.
                   -DLV_CONF_PATH=lv_conf_cydlcd.h
                   -Isrc
                   -Itools/tft_setup_cyd
                   ; BAT BUOC: TFT_eSPI phai nap tools/tft_setup_cyd/User_Setup.h (khong thi no dung
                   ; User_Setup.h mac dinh trong thu vien -> ILI9341, khong co TFT_BL/BACKLIGHT)
                   -DUSER_SETUP_LOADED=1
                   -include tools/tft_setup_cyd/User_Setup.h
                   -DARDUINO_USB_CDC_ON_BOOT=0
                   ; CORE_DEBUG_LEVEL=2 (ERROR): BAT de THAY log loi cua core Arduino (log_e).
                   ; Voi CORE_DEBUG_LEVEL=0 thi log_e bi bien thanh RONG => cac loi nhu
                   ; "spp init failed" / "spp register failed" (BluetoothSerial.cpp) LA VO HINH -
                   ; day chinh la ly do viec "SPP server khong dang ky duoc" kho ton tai lau.
                   ; Dat lai 0 khi moi thu da chay on (xem README 9.15).
                   -DCORE_DEBUG_LEVEL=2
                   ; P3 (the SD qua UART): Marlin gui 4 frame CYDLCD_F_SDDATA lien tiep (4x141 B = 564 B)
                   ; khi ghi 1 sector -> ring RX mac dinh cua core (256 B) + FIFO 128 B < 564 B.
                   ; Nang len 1024 B de khong bao gio mat du lieu khi vong lap man hinh CYD ban (LVGL/WiFi).
                   -DSERIAL_RX_BUFFER_SIZE=1024
                   -DSERIAL_TX_BUFFER_SIZE=256
                   ; DA LUONG (ke hoach cydlcd/docs/ke-hoach-da-luong.md): task `link` (serial Marlin) chay
                   ; MOT MINH tren core 1 voi uu tien 20; vong lap Arduino (loopTask: mang/WebServer/LVGL/log)
                   ; doi sang core 0 de khong bao gio tranh core voi duong serial.
                   -DARDUINO_RUNNING_CORE=0
                   -O2 -ffunction-sections -fdata-sections
lib_deps         = lvgl/lvgl@^8.3.11
                   bodmer/TFT_eSPI@^2.5.43
; CYD khong dung driver ILI9341 / encoder cua STM32 (va nguoc lai: STM32 khong dung port CYD ST7789) (chan PA5/PB0/PB12... khong co tren ESP32)
build_src_filter = +<*> -<marlin_link.cpp> -<ui.cpp> -<ui_port_stm32_ili9341.cpp> -<tft_ili9341.cpp> -<encoder.cpp>
monitor_speed    = 115200
; Nap: cam USB -> pio run -d cydlcd -e cydlcd_esp32 -t upload
