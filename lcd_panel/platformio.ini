; ===========================================================================
;  lcd_panel -- firmware MAN HINH RIENG (MCU cua man hinh tu render)
;
;  Day KHONG phai env cua Marlin: la mot project PlatformIO RIENG, nen co build flag /
;  script / thu vien cua Marlin khong the lot vao (va nguoc lai).
;
;  Build / nap (chay tu thu muc goc repo):
;      pio run   -d lcd_panel -e panel_f411cc           ; STM32F411CCU6  256K/128K  (UI tu ve, G-code)
;      pio run   -d lcd_panel -e panel_f103c6           ; STM32F103C6T6   32K/ 10K  (UI tu ve, G-code)
;      pio run   -d lcd_panel -e panel_f407vgz_lvgl     ; STM32F407VGT6    1M/128K  (LVGL + PUSH)
;      pio run   -d lcd_panel -e panel_esp32_cyd        ; ESP32-2432S028R "CYD"      (LVGL + PUSH)
;      pio run   -d lcd_panel -e panel_f411cc_lvgl      ; STM32F411CCU6             (LVGL + PUSH)
;      pio run   -d lcd_panel -e panel_esp32_cyd -t upload
;
;  HAI KIEU GIAO TIEP (chon bang env, khong phai sua code):
;    * "G-code"  (env *_f411cc / *_f103c6): panel tu hoi Marlin bang M105/M114/M27.
;              Nhe, chay duoc tren F103C6 32K, nhung KHONG lay duoc du lieu nang
;              (danh sach file, bed mesh, PID/steps/mm, prompt...).
;    * "PUSH"    (env *_lvgl): Marlin chu dong day frame nhi phan xuong (ExtUI
;              "panel_serial" trong Marlin, bat bang #define PANEL_SERIAL_UI) va panel
;              ve bang LVGL. Day la kieu dung cho man hinh moi.
;
;  Khi build, moi env CHI lay dung cac file no can (build_src_filter):
;    - env G-code: loai <src/panel_link.cpp>, <src/ui_lvgl.cpp>, <src/ui_lvgl_port.cpp>
;    - env PUSH  : loai <src/marlin_link.cpp>, <src/ui.cpp>   (khong keo code khong dung)
;
;  !!! CAN MANG lan dau: env LVGL keo platform espressif32 (chi CYD) + thu vien lvgl
;      (va TFT_eSPI cho CYD). Env STM32 khong-LVGL build duoc offline.
; ===========================================================================

[platformio]
default_envs = panel_f411cc

; ---------------------------------------------------------------------------
; Cau hinh chung cho cac board STM32 (framework Arduino cua ststm32)
; ---------------------------------------------------------------------------
[panel_common]
platform         = ststm32
framework        = arduino
build_type       = release
; -Os + LTO: F103C6T6 chi co 32 KB flash, ma rieng `Serial` (HardwareSerial + Print)
; da an mot phan dang ke. LVGL thi can them cho chuong trinh + font.
build_flags      = -Os -flto -ffunction-sections -fdata-sections
                   -fno-exceptions
                   -Wall -Wno-unused-variable
; C++-only flags (-fno-rtti, -fno-threadsafe-statics) them o day de file .c cua core
; khong keu warning
extra_scripts    = post:tools/cxx_flags.py
lib_deps         =
upload_protocol  = stlink
debug_tool       = stlink
monitor_speed    = 115200

; ---------------------------------------------------------------------------
; STM32F411CCU6 ("Black Pill" style, 48-pin) -- UI tu ve, giao tiep G-code
; ---------------------------------------------------------------------------
[env:panel_f411cc]
extends          = panel_common
board            = genericSTM32F411CC
build_flags      = ${panel_common.build_flags}
                   -DPANEL_BOARD_F411
                   -DPANEL_USE_LVGL=0
                   ; `Serial` = USART2 (PA2 TX / PA3 RX) -> di den Marlin
                   -DSERIAL_UART_INSTANCE=2 -DPIN_SERIAL_RX=PA3 -DPIN_SERIAL_TX=PA2
build_src_filter = +<*> -<panel_link.cpp> -<ui_lvgl.cpp> -<ui_lvgl_port.cpp>

; ---------------------------------------------------------------------------
; STM32F103C6T6 ("Blue Pill" 32K flash / 10K RAM) -- UI tu ve, giao tiep G-code
; (khong du cho LVGL: giu nguyen UI nhe)
; ---------------------------------------------------------------------------
[env:panel_f103c6]
extends          = panel_common
board            = genericSTM32F103C6
build_flags      = ${panel_common.build_flags}
                   -DPANEL_BOARD_F103C6
                   -DPANEL_USE_LVGL=0
                   -DSERIAL_UART_INSTANCE=2 -DPIN_SERIAL_RX=PA3 -DPIN_SERIAL_TX=PA2
build_src_filter = +<*> -<panel_link.cpp> -<ui_lvgl.cpp> -<ui_lvgl_port.cpp>

; ---------------------------------------------------------------------------
; STM32F411CCU6 + LVGL (PUSH) -- du RAM/flash cho LVGL
;   lv_conf.h nam trong src/ -> -DLV_CONF_INCLUDE_SIMPLE de LVGL include duoc
; ---------------------------------------------------------------------------
[env:panel_f411cc_lvgl]
extends          = panel_common
board            = genericSTM32F411CC
build_flags      = ${panel_common.build_flags}
                   -DPANEL_BOARD_F411
                   -DPANEL_USE_LVGL=1
                   -DLV_CONF_INCLUDE_SIMPLE
                   -Isrc
                   -DSERIAL_UART_INSTANCE=2 -DPIN_SERIAL_RX=PA3 -DPIN_SERIAL_TX=PA2
lib_deps         = lvgl/lvgl@^8.3.11
build_src_filter = +<*> -<marlin_link.cpp> -<ui.cpp>

; ---------------------------------------------------------------------------
; STM32F407VGT6 (1 MB flash / 128 KB RAM) + LVGL (PUSH)
;   Board khac (vd F407ZGT6 144 chan): doi `board =` thanh black_f407zg /
;   vccgnd_f407zg_mini / genericSTM32F407IGT6 va giu nguyen phan con lai.
; ---------------------------------------------------------------------------
[env:panel_f407vgz_lvgl]
extends          = panel_common
board            = genericSTM32F407VGT6
build_flags      = ${panel_common.build_flags}
                   -DPANEL_BOARD_F407
                   -DPANEL_USE_LVGL=1
                   -DLV_CONF_INCLUDE_SIMPLE
                   -Isrc
                   -DSERIAL_UART_INSTANCE=2 -DPIN_SERIAL_RX=PA3 -DPIN_SERIAL_TX=PA2
lib_deps         = lvgl/lvgl@^8.3.11
build_src_filter = +<*> -<marlin_link.cpp> -<ui.cpp>

; ---------------------------------------------------------------------------
; ESP32-2432S028R ("CYD") 2.8" 240x320 ILI9341 + XPT2046 -- LVGL (PUSH)
;
;   Man hinh: TFT_eSPI voi cau hinh rieng o tools/tft_setup/User_Setup.h
;   UART den Marlin: Serial2, GPIO22 (TX) / GPIO35 (RX) -- doi trong panel_config.h
;                    (PANEL_UART_TX / PANEL_UART_RX). Nho noi CHEO TX<->RX + chung GND.
;   CAN MANG lan dau (platform espressif32 + lvgl + TFT_eSPI).
; ---------------------------------------------------------------------------
[env:panel_esp32_cyd]
platform         = espressif32
board            = esp32dev
framework        = arduino
build_type       = release
build_flags      = -DPANEL_BOARD_CYD
                   -DPANEL_USE_LVGL=1
                   -DLV_CONF_INCLUDE_SIMPLE
                   -Isrc
                   -Itools/tft_setup
                   -DARDUINO_USB_CDC_ON_BOOT=0
                   -DCORE_DEBUG_LEVEL=0
                   -O2 -ffunction-sections -fdata-sections
lib_deps         = lvgl/lvgl@^8.3.11
                   bodmer/TFT_eSPI@^2.5.43
; CYD khong dung driver ILI9341 / encoder cua STM32 (chan PA5/PB0/PB12... khong co tren ESP32)
build_src_filter = +<*> -<marlin_link.cpp> -<ui.cpp> -<tft_ili9341.cpp> -<encoder.cpp>
monitor_speed    = 115200
; Nap: cam USB -> pio run -d lcd_panel -e panel_esp32_cyd -t upload
